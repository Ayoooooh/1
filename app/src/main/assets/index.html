<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest">
  <title>我的存款</title>
  
  
  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --card-soft:#f8faff;
      --text:#172033;
      --text-2:#42506a;
      --muted:#8b96aa;
      --line:#e8edf5;
      --accent:#4b67ff;
      --accent-2:#eef1ff;
      --accent-3:#dfe5ff;
      --good:#16a36b;
      --bad:#e35b67;
      --gold:#d8ad67;
      --shadow:0 12px 34px rgba(34,48,84,.08);
      --shadow-soft:0 8px 20px rgba(48,68,118,.05);
      --radius-xl:28px;
      --radius-lg:22px;
      --radius-md:16px;
      --radius-sm:13px;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 12% -8%, rgba(75,103,255,.12), transparent 25%),
        radial-gradient(circle at 92% 8%, rgba(194,161,104,.10), transparent 20%),
        linear-gradient(180deg,#f8faff 0%,#f4f7fb 48%,#eef2f7 100%);
    }

    .app{
      max-width:720px;
      margin:0 auto;
      padding:16px 14px 116px;
    }

    .top{
      position:relative;
      overflow:hidden;
      padding:22px 20px 24px;
      margin-bottom:14px;
      border-radius:30px;
      color:#fff;
      background:
        linear-gradient(145deg,#171f3c 0%,#293560 46%,#4450a6 100%);
      box-shadow:0 18px 44px rgba(25,35,78,.22);
      border:1px solid rgba(255,255,255,.08);
    }

    .top::before{
      content:"";
      position:absolute;
      width:200px;height:200px;
      right:-48px;top:-72px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.18) 0%,rgba(255,255,255,.02) 46%,transparent 68%);
      pointer-events:none;
    }

    .top::after{
      content:"";
      position:absolute;
      width:130px;height:130px;
      right:30px;bottom:-70px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(216,173,103,.18) 0%,transparent 70%);
      pointer-events:none;
    }

    .eyebrow{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      height:28px;
      padding:0 11px;
      border-radius:999px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.82);
      font-size:12px;
      font-weight:650;
      letter-spacing:.2px;
      margin-bottom:14px;
      backdrop-filter:blur(8px);
    }

    .total,.trend-current{
      position:relative;
      z-index:1;
      font-weight:800;
      letter-spacing:-1.3px;
      color:#fff;
    }
    .total{font-size:44px;line-height:1.04}
    .trend-current{font-size:38px;line-height:1.08}

    .sub{
      position:relative;
      z-index:1;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:14px;
      font-size:12px;
      color:rgba(255,255,255,.72);
    }
    .sub span{
      min-height:28px;
      display:inline-flex;
      align-items:center;
      padding:0 10px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(8px);
    }
    .delta.good,.trend-delta.good{color:#8ff0bd}
    .delta.bad,.trend-delta.bad{color:#ffb4bd}

    .card{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(232,237,245,.94);
      border-radius:24px;
      padding:16px;
      margin-top:12px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }

    .row{display:flex;align-items:center;gap:10px;min-width:0}
    .between{justify-content:space-between}

    h2{
      margin:0;
      font-size:16px;
      line-height:1.3;
      font-weight:800;
      color:#202a3d;
      letter-spacing:-.15px;
    }

    .muted{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .note{
      margin-top:10px;
      padding:10px 12px;
      font-size:12px;
      line-height:1.6;
      color:#7f8ba1;
      background:#f8faff;
      border:1px solid var(--line);
      border-radius:14px;
    }

    .rates{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:14px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-size:12px;
      font-weight:650;
      color:#5b6780;
    }

    input,select{
      width:100%;
      height:46px;
      border:1px solid var(--line);
      border-radius:15px;
      background:#fbfcff;
      padding:0 14px;
      font-size:16px;
      color:var(--text);
      outline:none;
      transition:.2s ease;
    }

    input:focus,select:focus{
      border-color:#b8c4ff;
      background:#fff;
      box-shadow:0 0 0 4px rgba(75,103,255,.09);
    }

    button{
      border:0;
      border-radius:15px;
      height:42px;
      padding:0 15px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:transform .14s ease,box-shadow .2s ease,background .2s ease;
    }
    button:active{transform:scale(.985)}

    .secondary{
      color:var(--accent);
      background:#f0f3ff;
      border:1px solid #e2e7ff;
    }

    .ghost{
      color:#5a667e;
      background:#f6f8fc;
      border:1px solid var(--line);
    }

    .iconbtn{
      width:40px;
      padding:0;
      color:#7c879b;
      background:#f7f9fc;
      border:1px solid var(--line);
    }

    .accounts{margin-top:12px}

    .acct{
      margin-top:10px;
      padding:11px;
      border-radius:18px;
      background:linear-gradient(180deg,#fff 0%,#fafbfe 100%);
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
    }
    .acct:first-child{margin-top:0}

    .acct-main{
      display:grid;
      grid-template-columns:minmax(82px,1fr) 1.18fr 88px 40px;
      gap:9px;
      align-items:center;
    }

    .name{
      height:42px;
      background:#fff;
      font-weight:750;
    }

    .amount{
      height:42px;
      background:#fff;
      text-align:right;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }

    .currency{
      height:42px;
      background:#fff;
      font-size:13px;
      font-weight:700;
    }

    .calc-action{
      margin-top:16px;
      padding-top:16px;
      border-top:1px dashed var(--line);
    }

    .calc-btn{
      width:100%;
      height:54px;
      border-radius:18px;
      color:#fff;
      font-size:16px;
      letter-spacing:.1px;
      background:linear-gradient(135deg,#6b79ff 0%,#4b67ff 58%,#354ed8 100%);
      box-shadow:0 14px 30px rgba(75,103,255,.28);
    }

    .calc-hint{
      margin-top:9px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }

    .mini{
      position:relative;
      min-width:0;
      padding:14px 13px;
      border-radius:18px;
      background:linear-gradient(180deg,#ffffff 0%,#f8faff 100%);
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
      overflow:hidden;
    }
    .mini::after{
      content:"";
      position:absolute;
      right:-12px;top:-12px;
      width:48px;height:48px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(75,103,255,.08),transparent 70%);
    }
    .mini .v{
      margin-top:6px;
      font-size:16px;
      font-weight:800;
      color:#202a40;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tabpage{display:none}
    .tabpage.active{display:block}

    .tabbar{
      position:sticky;
      bottom:10px;
      z-index:20;
      margin-top:18px;
      padding:6px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      border-radius:22px;
      background:rgba(255,255,255,.90);
      border:1px solid rgba(226,232,242,.95);
      box-shadow:0 18px 40px rgba(33,46,84,.15);
      backdrop-filter:blur(16px);
    }

    .tabbtn{
      height:48px;
      border-radius:16px;
      background:transparent;
      color:#8a95a9;
      font-size:14px;
    }

    .tabbtn.active{
      color:#fff;
      background:linear-gradient(135deg,#6576ff 0%,#4b67ff 100%);
      box-shadow:0 10px 22px rgba(75,103,255,.24);
    }

    .trend-head{
      position:relative;
      z-index:1;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .trend-delta{
      position:relative;
      z-index:1;
      padding:8px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.76);
    }

    .trend-filter{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .rangebtn{
      height:38px;
      padding:0 14px;
      border-radius:12px;
      color:#748096;
      background:#f6f8fc;
      border:1px solid var(--line);
      font-size:13px;
      box-shadow:none;
    }

    .rangebtn.active{
      color:var(--accent);
      background:#eef1ff;
      border-color:#dfe5ff;
      box-shadow:0 5px 14px rgba(75,103,255,.08);
    }

    .custom-range{
      display:none;
      grid-template-columns:1fr 1fr auto;
      gap:10px;
      margin-top:12px;
      align-items:end;
      padding:12px;
      border-radius:16px;
      background:#f8faff;
      border:1px solid var(--line);
    }

    .custom-range.show{display:grid}
    .custom-range input{height:42px;font-size:14px}
    .custom-range button{height:42px}

    .chart-stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }
    .chart-stats .mini .v{font-size:15px}

    .chart-wrap{
      margin-top:14px;
      padding:12px;
      border-radius:20px;
      background:
        linear-gradient(180deg,#fafbff 0%,#f6f8fc 100%);
      border:1px solid var(--line);
      overflow:hidden;
    }

    .chart-box{
      width:100%;
      height:280px;
      position:relative;
      color:var(--accent);
    }
    .chart-box svg{width:100%;height:100%;display:block}

    .chart-empty{
      height:220px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 20px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }

    .trend-list{margin-top:8px}

    .trend-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:14px 0;
      border-top:1px solid var(--line);
    }
    .trend-row:first-child{border-top:0}

    .trend-value{
      font-weight:800;
      color:#202a40;
    }

    .trend-date{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
    }

    .empty{
      padding:20px 0;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    @media(max-width:480px){
      .app{padding:12px 10px 106px}
      .top{padding:18px 16px 20px}
      .total{font-size:36px}
      .trend-current{font-size:32px}
      .rates,.summary,.chart-stats{grid-template-columns:1fr}
      .acct-main{grid-template-columns:78px minmax(92px,1fr) 78px 40px}
      .custom-range{grid-template-columns:1fr 1fr}
      .custom-range button{grid-column:1/-1}
      .trend-filter{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
      .rangebtn{padding:0 6px;font-size:12px}
    }
  
    .asset-head{
      position:relative;
      z-index:2;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .privacy-btn{
      width:42px;
      height:42px;
      padding:0;
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      color:#fff;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      box-shadow:none;
    }
    .privacy-btn svg{width:20px;height:20px;display:block}
    .privacy-btn .eye-off{display:none}
    .privacy-btn.is-hidden .eye-on{display:none}
    .privacy-btn.is-hidden .eye-off{display:block}

    .privacy-hidden .sensitive{
      filter:blur(12px);
      opacity:.55;
      color:inherit !important;
      text-shadow:none !important;
      user-select:none;
      pointer-events:none;
    }
    .privacy-hidden .card .sensitive,
    .privacy-hidden .mini .sensitive,
    .privacy-hidden .trend-row .sensitive{
      filter:blur(11px);
      opacity:.5;
      text-shadow:none !important;
    }
    .privacy-hidden input.amount{
      filter:blur(10px);
      opacity:.5;
      color:#5f6b82;
      -webkit-text-security:none;
      letter-spacing:0;
      pointer-events:none;
      user-select:none;
    }

  
    .privacy-hidden .total.sensitive,
    .privacy-hidden .trend-current.sensitive{
      filter:blur(15px);
      opacity:.42;
    }

  
    .asset-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .lock-screen{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:
        radial-gradient(circle at 20% 5%, rgba(87,105,255,.20), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(216,173,103,.14), transparent 22%),
        linear-gradient(145deg,#151d38 0%,#25315a 52%,#3d4890 100%);
    }
    .lock-screen.hidden{display:none}

    .lock-card{
      width:min(100%,390px);
      text-align:center;
      color:#fff;
    }

    .lock-logo{
      width:54px;
      height:54px;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(12px);
    }
    .lock-logo svg{width:26px;height:26px}

    .lock-title{
      font-size:24px;
      font-weight:800;
      letter-spacing:-.3px;
    }

    .lock-subtitle{
      margin-top:8px;
      font-size:13px;
      color:rgba(255,255,255,.66);
    }

    .pattern-wrap{
      position:relative;
      width:min(78vw,300px);
      aspect-ratio:1;
      margin:26px auto 10px;
      touch-action:none;
      user-select:none;
    }

    .pattern-grid{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      align-items:center;
      justify-items:center;
      z-index:2;
    }

    .pattern-dot{
      position:relative;
      width:58px;
      height:58px;
      padding:0;
      border-radius:50%;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:none;
    }

    .pattern-dot::before{
      content:"";
      position:absolute;
      left:50%;top:50%;
      width:12px;height:12px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(255,255,255,.78);
      transition:.14s ease;
    }

    .pattern-dot.active{
      background:rgba(122,143,255,.18);
      border-color:rgba(173,187,255,.62);
    }
    .pattern-dot.active::before{
      width:18px;height:18px;
      background:#cbd4ff;
      box-shadow:0 0 0 7px rgba(133,153,255,.14);
    }

    .pattern-dot.error{
      background:rgba(255,114,128,.14);
      border-color:rgba(255,155,164,.48);
    }
    .pattern-dot.error::before{
      background:#ffb0b8;
      box-shadow:0 0 0 7px rgba(255,114,128,.10);
    }

    .pattern-lines{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }

    .lock-message{
      min-height:22px;
      margin-top:8px;
      font-size:13px;
      color:rgba(255,255,255,.76);
    }
    .lock-message.error{color:#ffb5bd}
    .lock-message.success{color:#a8f0c8}

    .reset-pattern-btn{
      margin-top:10px;
      background:transparent;
      color:rgba(255,255,255,.62);
      border:0;
      height:38px;
      font-size:13px;
      box-shadow:none;
    }

    body.app-locked .app{
      filter:blur(16px);
      pointer-events:none;
      user-select:none;
    }

  
    .compare-card{overflow:hidden}
    .compare-picker{
      display:grid;
      grid-template-columns:1fr 34px 1fr;
      gap:10px;
      align-items:end;
      margin-top:16px;
    }
    .compare-picker select{
      height:46px;
      font-size:14px;
      font-weight:650;
    }
    .compare-arrow{
      height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9aa5b7;
      font-size:18px;
      font-weight:700;
    }
    .compare-btn{
      width:100%;
      height:48px;
      margin-top:12px;
      color:#fff;
      background:linear-gradient(135deg,#6576ff 0%,#4b67ff 100%);
      box-shadow:0 10px 22px rgba(75,103,255,.18);
    }
    .compare-result{margin-top:14px}
    .compare-empty{
      padding:22px 12px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      border:1px dashed var(--line);
      border-radius:16px;
      background:#fafbfe;
    }
    .compare-summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .compare-summary .mini{
      padding:13px;
    }
    .compare-big{
      font-size:18px !important;
      font-weight:850 !important;
    }
    .compare-section{
      margin-top:16px;
      padding-top:14px;
      border-top:1px solid var(--line);
    }
    .compare-section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      font-size:14px;
      font-weight:800;
      color:#303b51;
    }
    .compare-count{
      font-size:12px;
      color:var(--muted);
      font-weight:650;
    }
    .compare-item{
      display:grid;
      grid-template-columns:minmax(70px,1fr) auto;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-top:1px solid var(--line);
    }
    .compare-item:first-of-type{border-top:0}
    .compare-name{
      font-size:14px;
      font-weight:750;
      color:#273248;
    }
    .compare-values{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
    }
    .compare-delta{
      text-align:right;
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
    }
    .compare-delta.good{color:var(--good)}
    .compare-delta.bad{color:var(--bad)}
    .compare-delta.neutral{color:var(--muted)}
    .compare-note{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff8eb;
      border:1px solid #f3e6c8;
      color:#8a6b30;
      font-size:12px;
      line-height:1.55;
    }
    @media(max-width:480px){
      .compare-picker{
        grid-template-columns:1fr;
      }
      .compare-arrow{
        height:20px;
        transform:rotate(90deg);
      }
      .compare-summary{
        grid-template-columns:1fr;
      }
    }

  </style>


</head>
<body>

<div class="lock-screen" id="lockScreen" aria-live="polite">
  <div class="lock-card">
    <div class="lock-logo">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="5" y="10" width="14" height="10" rx="3" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="lock-title" id="lockTitle">手势解锁</div>
    <div class="lock-subtitle" id="lockSubtitle">请绘制你的解锁手势</div>

    <div class="pattern-wrap" id="patternWrap">
      <svg class="pattern-lines" id="patternLines" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
      <div class="pattern-grid" id="patternGrid">
